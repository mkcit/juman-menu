:root{
  --bg:#F7F1E8;--card:#FFFFFF;--ink:#2E1B10;--ink2:#6B5443;--line:#EADCC6;
  --brown:#3A2214;--brown2:#55331F;--gold:#E2B887;--gold2:#B4844D;--goldDeep:#8A6332;
  --ok:#2F7D4F;--danger:#B23B2E;--shadow:0 6px 20px rgba(58,34,20,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"JumanSans",system-ui,"Segoe UI",Tahoma,sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior-y:contain}
input,select,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;cursor:pointer;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}

/* ---------- الرأس ---------- */
.hero{background:linear-gradient(160deg,#3A2214 0%,#24140B 100%);color:var(--gold);padding:calc(14px + env(safe-area-inset-top)) 16px 18px;border-radius:0 0 22px 22px;position:relative}
.hero .row{display:flex;align-items:center;gap:12px}
.hero img{height:52px;width:auto}
.hero h1{margin:0;font-size:21px;font-weight:800;letter-spacing:0}
.hero p{margin:2px 0 0;font-size:12.5px;color:#CDB497}
.hero .gear{margin-inline-start:auto;width:42px;height:42px;border-radius:12px;border:1px solid rgba(226,184,135,.35);background:rgba(255,255,255,.06);display:grid;place-items:center}
.hero .gear svg{width:22px;height:22px;stroke:var(--gold)}
.search{margin-top:14px;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 44px 12px 14px;border-radius:14px;border:0;background:#fff;color:var(--ink);outline:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--ink2)}

.chips{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--ink2);transition:all .15s}
.chip.on{background:var(--brown);border-color:var(--brown);color:var(--gold);box-shadow:0 4px 12px rgba(58,34,20,.25)}

/* ---------- الأصناف ---------- */
.list{padding:0 16px 140px}
.cat-title{display:flex;align-items:center;gap:10px;margin:18px 2px 10px;font-size:15px;font-weight:800;color:var(--goldDeep)}
.cat-title::after{content:"";flex:1;height:1px;background:var(--line)}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 12px 12px 10px;margin-bottom:8px;box-shadow:var(--shadow);border:1px solid transparent;transition:border-color .15s,transform .08s}
.card:active{transform:scale(.99)}
.card.picked{border-color:var(--gold2);background:#FFFBF5}
.card .info{flex:1;min-width:0}
.card .name{font-size:16px;font-weight:700;line-height:1.35}
.card .sub{font-size:12.5px;color:var(--ink2);margin-top:2px}
.card .price{font-size:15px;font-weight:800;color:var(--goldDeep);margin-top:4px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:12px;border:0;display:grid;place-items:center;font-size:22px;font-weight:700;line-height:1}
.stepper .plus{background:var(--brown);color:var(--gold)}
.stepper .minus{background:#F1E6D6;color:var(--brown)}
.stepper .n{min-width:24px;text-align:center;font-size:17px;font-weight:800}
.empty{text-align:center;color:var(--ink2);padding:40px 10px}

/* ---------- شريط المجموع ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.bar .inner{max-width:536px;margin:0 auto;pointer-events:auto;background:var(--brown);color:#fff;border-radius:20px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(36,20,11,.35)}
.bar .sum{flex:1;min-width:0}
.bar .sum b{display:block;font-size:24px;color:var(--gold);line-height:1.2}
.bar .sum span{font-size:12.5px;color:#CDB497}
.bar .btn{border:0;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:800}
.btn-gold{background:var(--gold);color:var(--brown)}
.btn-ghost{background:rgba(255,255,255,.08);color:#F3E3CC;border:1px solid rgba(226,184,135,.35)!important}
.pop{animation:pop .25s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ---------- النوافذ السفلية ---------- */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(20,10,5,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.open{opacity:1;pointer-events:auto}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease}
.sheet.open .panel{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:#D8C6AC;margin:2px auto 12px}
.panel h3{margin:0 0 12px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.panel h3 .x{margin-inline-start:auto;border:0;background:#EFE3D2;border-radius:10px;width:36px;height:36px;font-size:18px}
.line{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px}
.line .nm{flex:1;min-width:0;font-weight:700}
.line .nm small{display:block;font-weight:500;color:var(--ink2);font-size:12.5px}
.line .tt{font-weight:800;min-width:58px;text-align:left;color:var(--goldDeep)}
.grand{display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:800;padding:14px 4px 6px}
.grand b{color:var(--goldDeep)}
.row-btns{display:flex;gap:8px;margin-top:10px}
.row-btns .btn{flex:1;border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:800}
.btn-dark{background:var(--brown);color:var(--gold)}
.btn-soft{background:#EFE3D2;color:var(--brown)}
.btn-danger{background:#F7E1DD;color:var(--danger)}
.confirm{display:none;background:#FFF4E2;border:1px solid var(--gold);border-radius:14px;padding:12px;margin-top:10px;font-weight:700}
.confirm.show{display:block}

/* ---------- الحقول ---------- */
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(226,184,135,.35)}
.price-input{display:flex;align-items:center;gap:8px}
.price-input input{text-align:center;font-size:22px;font-weight:800}
.price-input input::-webkit-outer-spin-button,.price-input input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.price-input input{-moz-appearance:textfield;appearance:textfield}
.price-input button{width:52px;height:52px;border-radius:12px;border:0;background:#EFE3D2;font-size:24px;font-weight:800}
.hint{font-size:12.5px;color:var(--ink2);line-height:1.6}
.err{color:var(--danger);font-weight:700;font-size:14px;min-height:20px}
.pin{display:flex;gap:10px;justify-content:center;margin:6px 0 14px}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--brown);display:block}
.pin i.f{background:var(--brown)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.pad button{height:58px;border-radius:14px;border:0;background:#fff;font-size:24px;font-weight:800;box-shadow:var(--shadow)}

/* ---------- وضع التعديل ---------- */
.edit-hero{background:linear-gradient(160deg,#55331F,#3A2214)}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:14px 16px 0}
.tool{display:flex;align-items:center;gap:8px;background:#fff;border:0;border-radius:14px;padding:12px;font-size:14px;font-weight:800;box-shadow:var(--shadow)}
.tool-wide{grid-column:1/-1;justify-content:center;background:var(--brown)!important;color:var(--gold)}
.tool-wide svg{stroke:var(--gold)!important}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.checks label{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700}
.checks input{width:18px;height:18px;accent-color:#3A2214}
.tool svg{width:20px;height:20px;stroke:var(--goldDeep);flex:0 0 auto}
.ecat{display:flex;align-items:center;gap:6px;margin:20px 2px 8px}
.ecat b{flex:1;font-size:16px;color:var(--goldDeep)}
.ecat button,.erow .mini{border:0;background:#EFE3D2;border-radius:10px;min-width:36px;height:36px;font-size:15px;font-weight:800;padding:0 8px}
.erow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:7px;box-shadow:var(--shadow)}
.erow .nm{flex:1;min-width:0;font-weight:700}
.erow .nm small{display:block;color:var(--ink2);font-weight:500;font-size:12px}
.erow .pr{font-weight:800;color:var(--goldDeep);white-space:nowrap}
.erow.off{opacity:.55}
.sw{position:relative;width:46px;height:28px;border-radius:99px;background:#D9CBB6;border:0;flex:0 0 auto;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)}
.sw.on::after{right:21px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:#F7E1DD;color:var(--danger);margin-inline-start:6px;vertical-align:middle}
.warn{background:#FFF4E2;border:1px solid var(--gold);border-radius:12px;padding:10px 12px;margin:12px 16px 0;font-size:13px;font-weight:600}
textarea.code{font-family:monospace;font-size:12px;direction:ltr;height:110px}

/* ---------- تنبيه سريع ---------- */
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#24140B;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:all .2s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{text-align:center;font-size:12px;color:var(--ink2);padding:10px 0 0}
</style>

.welcome{margin:10px 16px 0;background:#fff;border-radius:14px;padding:10px 12px;font-size:13px;color:var(--ink2);box-shadow:var(--shadow)}
</style>

     ["تشكن برجر",35],["تشكن كرسبي برجر",40],["تشكن بيتزا",35],["ستربس",40],["تشكن ستروجانوف",55,"صدر دجاج · فلفل رومي · بصل · كريمة طبخ · أرز أبيض"]]],
  ["المقبلات والسلطات", [["سلطة سيزر",25],["سلطة مقدوس",25],["سلطة يوناني",20],["فتوش",20],["ورق عنب",20],["فتة يالانجي",25],
     ["حمّص باللحمة",15],["خبز بالثوم",15],["كول سلو",12],["ذرة بالمايونيز",10],["مخللات",5]]],
  ["الحلويات", [["حلا جُمان",25],["تيراميسو",25],["حلاوة الجبن",25],["ليالي لبنان",20],["حلا الشمواه",15],["تشيز كيك",15]]],
  ["مساحة العمل", [["مساحة العمل — ساعة",10]]],
];
const fromBuiltin = () => ({ updatedAt: null, cats: BUILTIN.map(([name, list]) => ({ name, items: list.map(([n, p, s]) => ({ name: n, price: p, sub: s || "", off: false })) })) });
const valid = m => m && Array.isArray(m.cats) && m.cats.every(c => c && typeof c.name === "string" && Array.isArray(c.items)
  && c.items.every(i => i && typeof i.name === "string" && typeof i.price === "number" && isFinite(i.price) && i.price >= 0));
const K_CACHE = "juman.public.menu", K_PICK = "juman.public.pick";
const load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

let menu = load(K_CACHE, null); if (!valid(menu)) menu = fromBuiltin();
let pick = load(K_PICK, {}); if (!pick || typeof pick !== "object") pick = {};
let catFilter = "all", query = "";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => (Math.round(n * 100) / 100).toLocaleString("en-US", { maximumFractionDigits: 2 }) + " ₪";
const norm = s => String(s).replace(/[ً-ْـ]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").toLowerCase();
const key = (c, i) => c.name + "|" + i.name;   // بلا أرقام داخلية — الاسم يكفي
function prepare() { menu.cats.forEach(c => c.items.forEach(i => { i.sub = typeof i.sub === "string" ? i.sub : ""; i.off = !!i.off; i.key = key(c, i); })); }
prepare();

function render() {
  $("#chips").innerHTML = `<button class="chip ${catFilter === "all" ? "on" : ""}" data-cat="all">الكل</button>` +
    menu.cats.map((c, ci) => c.items.some(i => !i.off) ? `<button class="chip ${catFilter === ci ? "on" : ""}" data-cat="${ci}">${esc(c.name)}</button>` : "").join("");
  renderList(); renderTotal(false);
}
function renderList() {
  const q = norm(query.trim()); let html = "";
  menu.cats.forEach((c, ci) => {
    if (!q && catFilter !== "all" && ci !== catFilter) return;
    const items = c.items.filter(i => !i.off && (!q || norm(i.name + " " + i.sub + " " + c.name).includes(q)));
    if (!items.length) return;
    html += `<div class="cat-title">${esc(c.name)}</div>`;
    for (const i of items) {
      const n = pick[i.key] || 0;
      html += `<div class="card ${n ? "picked" : ""}" data-add="${esc(i.key)}">
        <div class="info"><div class="name">${esc(i.name)}</div>${i.sub ? `<div class="sub">${esc(i.sub)}</div>` : ""}<div class="price">${money(i.price)}</div></div>
        <div class="stepper">${n ? `<button class="minus" data-minus="${esc(i.key)}" aria-label="أنقص">−</button><span class="n">${n}</span>` : ""}
          <button class="plus" data-add="${esc(i.key)}" aria-label="أضف">+</button></div></div>`;
    }
  });
  const d = menu.updatedAt ? new Date(menu.updatedAt) : null, p = n => String(n).padStart(2, "0");
  $("#list").innerHTML = (html || `<div class="empty">لا صنف بهذا الاسم</div>`) +
    `<div class="foot">${d ? `الأسعار محدّثة ${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} · ` : ""}الأسعار بالشيكل</div>`;
}
const lines = () => { const out = []; for (const c of menu.cats) for (const i of c.items) if (!i.off && pick[i.key] > 0) out.push({ ...i, n: pick[i.key] }); return out; };
function renderTotal(anim = true) {
  const ls = lines(), total = ls.reduce((s, l) => s + l.price * l.n, 0), pieces = ls.reduce((s, l) => s + l.n, 0);
  $(".bar").classList.toggle("hidden", !pieces);
  $("#total").textContent = money(total);
  $("#count").textContent = pieces + " قطعة · " + ls.length + " صنف";
  if (anim) { const t = $("#total"); t.classList.remove("pop"); void t.offsetWidth; t.classList.add("pop"); }
}
function change(k, d) {
  const n = Math.max(0, (pick[k] || 0) + d); if (n) pick[k] = n; else delete pick[k];
  store(K_PICK, pick); try { navigator.vibrate && navigator.vibrate(8); } catch (e) {}
  renderList(); renderTotal(); if ($("#sheet").classList.contains("open")) openPicks();
}
function openPicks() {
  const ls = lines(), total = ls.reduce((s, l) => s + l.price * l.n, 0);
  $("#panel").innerHTML = `<div class="grab"></div><h3>اختياراتي <button class="x" data-act="close" aria-label="إغلاق">✕</button></h3>
    ${ls.map(l => `<div class="line"><div class="nm">${esc(l.name)}<small>${money(l.price)} × ${l.n}</small></div>
      <div class="stepper"><button class="minus" data-minus="${esc(l.key)}">−</button><span class="n">${l.n}</span><button class="plus" data-add="${esc(l.key)}">+</button></div>
      <div class="tt">${money(l.price * l.n)}</div></div>`).join("") || `<div class="empty">لم تختر شيئاً بعد</div>`}
    <div class="grand"><span>المجموع</span><b>${money(total)}</b></div>
    <p class="hint" style="text-align:center">أرِ هذه القائمة للنادل ليسجّل طلبك · الدفع عند الكاشير</p>
    <div class="row-btns"><button class="btn btn-soft" data-act="close">رجوع</button><button class="btn btn-danger" data-act="clear">امسح اختياراتي</button></div>`;
  $("#sheet").classList.add("open");
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-add],[data-minus],[data-cat],[data-act]");
  if (!t) { if (e.target.id === "sheet") $("#sheet").classList.remove("open"); return; }
  const d = t.dataset;
  if (d.minus) return change(d.minus, -1);
  if (d.add) return change(d.add, 1);
  if (d.cat) { catFilter = d.cat === "all" ? "all" : +d.cat; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (d.act === "picks") return openPicks();
  if (d.act === "close") return $("#sheet").classList.remove("open");
  if (d.act === "clear") { pick = {}; store(K_PICK, pick); $("#sheet").classList.remove("open"); renderList(); renderTotal(false); }
});
$("#q").addEventListener("input", e => { query = e.target.value; renderList(); });
render();
// أحدث قائمة من menu.json (بلا ذاكرة مؤقتة قديمة)
fetch("menu.json?v=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(m => {
  if (!valid(m)) return;
  menu = { updatedAt: m.updatedAt || null, cats: m.cats.map(c => ({ name: c.name, items: c.items.map(i => ({ name: i.name, price: i.price, sub: i.sub || "", off: !!i.off })) })) };
  prepare(); store(K_CACHE, menu); render();
}).catch(() => {});

</script>
</body>
</html>
